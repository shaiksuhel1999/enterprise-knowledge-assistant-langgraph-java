server:
  port: 8085
spring:
  application:
    name: enterprise-knowledge-assistant-mcp

  # In-memory H2 database (auto-created on startup, dropped on shutdown)
  datasource:
    url: jdbc:h2:mem:ekadb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    # Let Hibernate create the schema first, THEN run data.sql to seed it.
    defer-datasource-initialization: true

  sql:
    init:
      mode: always        # always run schema.sql / data.sql (also for in-memory DB)

  h2:
    console:
      enabled: true        # browse the data at http://localhost:8085/h2-console

  ai:
    mcp:
      server:
        name: enterprise-knowledge-assistant-mcp
        version: 1.1.2
        enabled: true

        # Transport
        protocol: sse

        # SSE endpoints
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

        # Tool discovery
        annotation-scanner:
          enabled: true

        # Execution model
        type: async

        # Timeouts
        request-timeout: 600000

        # Capabilities
        capabilities:
          tool: true
          prompt: false
          resource: false
          completion: false

        # Optional description
        instructions: "This MCP server provides Information on enterprise knowledge"

        # Metadata notifications
        tool-change-notification: true
        resource-change-notification: true
        prompt-change-notification: true