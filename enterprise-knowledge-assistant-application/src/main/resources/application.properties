spring.application.name=enterprise-knowledge-assistant-application

# --- H2 Console Configuration ---
# Enables the browser-based H2 web console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Datasource Configuration ---
# In-Memory database URL (data is lost when app restarts)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
# OR File-based persistent URL (uncomment to save data locally to a folder):
# spring.datasource.url=jdbc:h2:file:./data/testdb

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate Configuration ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OpenAI (set OPENAI_API_KEY in the environment)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4.1-mini


# MCP client - update URL/transport to match your MCP server
spring.ai.mcp.client.type=async
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.initialized=true
spring.ai.mcp.client.annotation-scanner.enabled=true
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.sse.connections.server1=http://localhost:8085

